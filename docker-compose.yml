name: digital-bank

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports: ["54329:5432"]
    volumes:
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-time init Postgres runs a temporary server on
      # the unix socket only, which a socket check would call ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bank"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  kms-service:
    build: { context: ., args: { SERVICE: kms-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/kms-service.pem
      TLS_KEY: /certs/kms-service-key.pem
      ALLOWED_CALLERS: identity-service,account-service,card-service,pix-service,user-service,dev-client
      KMS_OPERATORS: dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/kms?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9008"
      # Development root key. Production: an HSM that never exports it.
      KMS_ROOT_KEY: nPl/UsZeBvOdBpqezdYwmNBqqvWttMcawFsXJ3boInM=
    ports: ["9008:9008"]
    depends_on:
      postgres: { condition: service_healthy }

  ledger-service:
    build: { context: ., args: { SERVICE: ledger-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/ledger-service.pem
      TLS_KEY: /certs/ledger-service-key.pem
      ALLOWED_CALLERS: account-service,transaction-service,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/ledger?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9001"
    ports: ["9001:9001"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  account-service:
    build: { context: ., args: { SERVICE: account-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      KMS_ADDR: kms-service:9008
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/account-service.pem
      TLS_KEY: /certs/account-service-key.pem
      ALLOWED_CALLERS: api-gateway,transaction-service,pix-service,card-service,credit-service,notification-service,backoffice-service,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/account?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9002"
      LEDGER_ADDR: ledger-service:9001
      USER_ADDR: user-service:9012
    ports: ["9002:9002"]
    depends_on:
      kms-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      ledger-service: { condition: service_healthy }
      user-service: { condition: service_healthy }

  user-service:
    build: { context: ., args: { SERVICE: user-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      KMS_ADDR: kms-service:9008
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/user-service.pem
      TLS_KEY: /certs/user-service-key.pem
      ALLOWED_CALLERS: api-gateway,account-service,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/users?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9012"
    ports: ["9012:9012"]
    depends_on:
      kms-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  backoffice-service:
    build: { context: ., args: { SERVICE: backoffice-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/backoffice-service.pem
      TLS_KEY: /certs/backoffice-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/backoffice?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9013"
      ACCOUNT_ADDR: account-service:9002
    ports: ["9013:9013"]
    depends_on:
      postgres: { condition: service_healthy }
      account-service: { condition: service_healthy }

  transaction-service:
    build: { context: ., args: { SERVICE: transaction-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/transaction-service.pem
      TLS_KEY: /certs/transaction-service-key.pem
      ALLOWED_CALLERS: api-gateway,pix-service,card-service,credit-service,payment-service,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/transaction?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9003"
      LEDGER_ADDR: ledger-service:9001
      ACCOUNT_ADDR: account-service:9002
    ports: ["9003:9003"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      ledger-service: { condition: service_healthy }
      account-service: { condition: service_healthy }

  pix-service:
    build: { context: ., args: { SERVICE: pix-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      KMS_ADDR: kms-service:9008
      PIX_QR_LOCATION: api-gateway:8080/pix/qr/v2
      PIX_QR_SCHEME: http
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/pix-service.pem
      TLS_KEY: /certs/pix-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/pix?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9004"
      ACCOUNT_ADDR: account-service:9002
      TRANSACTION_ADDR: transaction-service:9003
    ports: ["9004:9004"]
    depends_on:
      kms-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }

  statement-service:
    build: { context: ., args: { SERVICE: statement-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/statement-service.pem
      TLS_KEY: /certs/statement-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/statement?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9005"
    ports: ["9005:9005"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  identity-service:
    build: { context: ., args: { SERVICE: identity-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      # Development / demo back-office analyst (production staff come from SSO).
      # Development analysts as email:TOTP secret (the back office requires
      # MFA; four-eyes approvals need two). Never in production.
      BOOTSTRAP_ANALYSTS: analista@digitalbank.dev:JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP,revisora@digitalbank.dev:KRSXG5CTMVRXEZLUKRSXG5CTMVRXEZLU
      BOOTSTRAP_ANALYST_PASSWORD: correct horse battery staple
      KMS_ADDR: kms-service:9008
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/identity-service.pem
      TLS_KEY: /certs/identity-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/identity?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9006"
    ports: ["9006:9006"]
    depends_on:
      kms-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  card-service:
    build: { context: ., args: { SERVICE: card-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      KMS_ADDR: kms-service:9008
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/card-service.pem
      TLS_KEY: /certs/card-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/card?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9007"
      ACCOUNT_ADDR: account-service:9002
      TRANSACTION_ADDR: transaction-service:9003
      CREDIT_ADDR: credit-service:9009
    ports: ["9007:9007"]
    depends_on:
      kms-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      credit-service: { condition: service_healthy }

  credit-service:
    build: { context: ., args: { SERVICE: credit-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/credit-service.pem
      TLS_KEY: /certs/credit-service-key.pem
      ALLOWED_CALLERS: api-gateway,card-service,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/credit?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9009"
      ACCOUNT_ADDR: account-service:9002
      TRANSACTION_ADDR: transaction-service:9003
      CYCLE_INTERVAL: 5s
    ports: ["9009:9009"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }

  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/payment-service.pem
      TLS_KEY: /certs/payment-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/payment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9010"
      TRANSACTION_ADDR: transaction-service:9003
    ports: ["9010:9010"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      transaction-service: { condition: service_healthy }

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/notification-service.pem
      TLS_KEY: /certs/notification-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/notification?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9011"
      ACCOUNT_ADDR: account-service:9002
    ports: ["9011:9011"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      account-service: { condition: service_healthy }

  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/api-gateway.pem
      TLS_KEY: /certs/api-gateway-key.pem
      HTTP_ADDR: ":8080"
      SANDBOX: "true"
      # The mobile app on the web (expo start --web / the e2e build).
      CORS_ALLOWED_ORIGINS: http://localhost:8082
      # Tests and the demo log in many times from one IP; the default is 2/s.
      AUTH_RATE_LIMIT_RPS: "50"
      REDIS_ADDR: redis:6379
      IDENTITY_ADDR: identity-service:9006
      ACCOUNT_ADDR: account-service:9002
      TRANSACTION_ADDR: transaction-service:9003
      PIX_ADDR: pix-service:9004
      STATEMENT_ADDR: statement-service:9005
      CARD_ADDR: card-service:9007
      CREDIT_ADDR: credit-service:9009
      PAYMENT_ADDR: payment-service:9010
      NOTIFICATION_ADDR: notification-service:9011
      USER_ADDR: user-service:9012
      BACKOFFICE_ADDR: backoffice-service:9013
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports: ["8000:8080"]
    depends_on:
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      pix-service: { condition: service_healthy }
      statement-service: { condition: service_healthy }
      card-service: { condition: service_healthy }
      credit-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      backoffice-service: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["8081:8080"]
    depends_on:
      api-gateway: { condition: service_healthy }

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.2.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  pgdata:
