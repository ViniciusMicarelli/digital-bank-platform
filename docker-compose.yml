name: digital-bank

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports: ["54329:5432"]
    volumes:
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  ledger-service:
    build: { context: ., args: { SERVICE: ledger-service } }
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/ledger-service.pem
      TLS_KEY: /certs/ledger-service-key.pem
      ALLOWED_CALLERS: account-service,transaction-service,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/ledger?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9001"
    ports: ["9001:9001"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  account-service:
    build: { context: ., args: { SERVICE: account-service } }
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/account-service.pem
      TLS_KEY: /certs/account-service-key.pem
      # Development key-encryption key for CPFs. Production reads it from a KMS.
      ACCOUNT_KEK: 8vw7TApbgElf6gJ33aCaHpoEXgwCXx1jwX/pW83osDo=
      ALLOWED_CALLERS: api-gateway,transaction-service,pix-service,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/account?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9002"
      LEDGER_ADDR: ledger-service:9001
    ports: ["9002:9002"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      ledger-service: { condition: service_started }

  transaction-service:
    build: { context: ., args: { SERVICE: transaction-service } }
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/transaction-service.pem
      TLS_KEY: /certs/transaction-service-key.pem
      ALLOWED_CALLERS: api-gateway,pix-service,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/transaction?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9003"
      LEDGER_ADDR: ledger-service:9001
      ACCOUNT_ADDR: account-service:9002
    ports: ["9003:9003"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      ledger-service: { condition: service_started }
      account-service: { condition: service_started }

  pix-service:
    build: { context: ., args: { SERVICE: pix-service } }
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/pix-service.pem
      TLS_KEY: /certs/pix-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/pix?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9004"
      ACCOUNT_ADDR: account-service:9002
      TRANSACTION_ADDR: transaction-service:9003
    ports: ["9004:9004"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      account-service: { condition: service_started }
      transaction-service: { condition: service_started }

  statement-service:
    build: { context: ., args: { SERVICE: statement-service } }
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/statement-service.pem
      TLS_KEY: /certs/statement-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/statement?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9005"
    ports: ["9005:9005"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  identity-service:
    build: { context: ., args: { SERVICE: identity-service } }
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/identity-service.pem
      TLS_KEY: /certs/identity-service-key.pem
      ALLOWED_CALLERS: api-gateway,dev-client
      DATABASE_URL: postgres://bank:bank@postgres:5432/identity?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9006"
      # Development key-encryption key. Production reads it from a KMS.
      IDENTITY_KEK: 2Vn1NRQQasSBGXSwvKtdiUW0raXtu5vzeBrtLQ6uhd8=
    ports: ["9006:9006"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    volumes:
      - ./infrastructure/certs:/certs:ro
    environment:
      TLS_CA: /certs/ca.pem
      TLS_CERT: /certs/api-gateway.pem
      TLS_KEY: /certs/api-gateway-key.pem
      HTTP_ADDR: ":8080"
      SANDBOX: "true"
      # Tests and the demo log in many times from one IP; the default is 2/s.
      AUTH_RATE_LIMIT_RPS: "50"
      REDIS_ADDR: redis:6379
      IDENTITY_ADDR: identity-service:9006
      ACCOUNT_ADDR: account-service:9002
      TRANSACTION_ADDR: transaction-service:9003
      PIX_ADDR: pix-service:9004
      STATEMENT_ADDR: statement-service:9005
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports: ["8000:8080"]
    depends_on:
      redis: { condition: service_healthy }
      identity-service: { condition: service_started }
      account-service: { condition: service_started }
      transaction-service: { condition: service_started }
      pix-service: { condition: service_started }
      statement-service: { condition: service_started }

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.2.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  pgdata:
