name: digital-bank

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports: ["54329:5432"]
    volumes:
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank"]
      interval: 2s
      timeout: 3s
      retries: 30

  ledger-service:
    build: { context: ., args: { SERVICE: ledger-service } }
    environment:
      DATABASE_URL: postgres://bank:bank@postgres:5432/ledger?sslmode=disable
      GRPC_ADDR: ":9001"
    ports: ["9001:9001"]
    depends_on:
      postgres: { condition: service_healthy }

  account-service:
    build: { context: ., args: { SERVICE: account-service } }
    environment:
      DATABASE_URL: postgres://bank:bank@postgres:5432/account?sslmode=disable
      GRPC_ADDR: ":9002"
      LEDGER_ADDR: ledger-service:9001
    ports: ["9002:9002"]
    depends_on:
      postgres: { condition: service_healthy }
      ledger-service: { condition: service_started }

  transaction-service:
    build: { context: ., args: { SERVICE: transaction-service } }
    environment:
      DATABASE_URL: postgres://bank:bank@postgres:5432/transaction?sslmode=disable
      GRPC_ADDR: ":9003"
      LEDGER_ADDR: ledger-service:9001
      ACCOUNT_ADDR: account-service:9002
    ports: ["9003:9003"]
    depends_on:
      postgres: { condition: service_healthy }
      ledger-service: { condition: service_started }
      account-service: { condition: service_started }

volumes:
  pgdata:
