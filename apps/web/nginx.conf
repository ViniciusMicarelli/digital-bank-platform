server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location /v1/notifications/stream {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_buffering off;          # Server-Sent Events go out as they come
        proxy_read_timeout 15m;
    }
    location ~ ^/(v1|pix/qr)/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /assets/ {
        expires 1y;                   # hashed file names
    }
    location / {
        try_files $uri /index.html;   # client-side routes
        expires -1;                   # always fetch the latest index.html
        # (no add_header here: it would drop the security headers above)
    }
}
