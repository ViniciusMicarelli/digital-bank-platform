global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - api-gateway:8080
          - ledger-service:9101
          - account-service:9102
          - transaction-service:9103
          - pix-service:9104
          - statement-service:9105
          - identity-service:9106
