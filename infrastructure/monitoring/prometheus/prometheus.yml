global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - api-gateway:8080
          - ledger-service:9101
          - account-service:9102
          - transaction-service:9103
          - pix-service:9104
          - statement-service:9105
          - identity-service:9106
          - card-service:9107
          - credit-service:9109
          - payment-service:9110
          - notification-service:9111
          - user-service:9112
          - kms-service:9108
