syntax = "proto3";

package bank.pix.v1;

import "bank/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// PixService implements Pix, the Brazilian instant payment system. The
// Central Bank's DICT (key directory) and SPI (settlement) are simulated.
service PixService {
  rpc RegisterKey(RegisterKeyRequest) returns (RegisterKeyResponse);
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);

  // Who the account sends Pix to: favorites first, then the most recent
  // receivers (from completed outgoing transfers).
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  // Saves a key as a favorite, with an optional nickname (the name comes
  // from the key's lookup). Fails with FAILED_PRECONDITION and reason
  // OWN_KEY or TOO_MANY_FAVORITES.
  rpc SaveFavorite(SaveFavoriteRequest) returns (SaveFavoriteResponse);
  rpc RemoveFavorite(RemoveFavoriteRequest) returns (RemoveFavoriteResponse);
  // Resolves a key to the receiver before the customer confirms a transfer.
  rpc LookupKey(LookupKeyRequest) returns (LookupKeyResponse);

  // Sends a Pix. Idempotent on idempotency_key.
  rpc CreateTransfer(CreateTransferRequest) returns (CreateTransferResponse);
  rpc GetTransfer(GetTransferRequest) returns (GetTransferResponse);
  // Pix sent and/or received by an account, newest first.
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);

  // Simulates the SPI delivering a Pix sent by another bank to one of our keys.
  rpc SimulateIncoming(SimulateIncomingRequest) returns (SimulateIncomingResponse);

  // Issues a BR Code ("Pix copia e cola") for one of the account's keys.
  rpc CreateQrCode(CreateQrCodeRequest) returns (CreateQrCodeResponse);
  // Validates a BR Code and resolves its receiver, before paying.
  rpc DecodeQrCode(DecodeQrCodeRequest) returns (DecodeQrCodeResponse);
  // Pays a BR Code. A one-time code of this bank can be paid only once.
  rpc PayQrCode(PayQrCodeRequest) returns (PayQrCodeResponse);
  // Returns (part of) a received Pix to the payer, within 90 days.
  rpc RefundTransfer(RefundTransferRequest) returns (RefundTransferResponse);
  // The signed payload of a dynamic QR code (served publicly at its URL).
  rpc GetDynamicQrPayload(GetDynamicQrPayloadRequest) returns (GetDynamicQrPayloadResponse);
  // Public keys that verify dynamic QR payloads.
  rpc GetQrJwks(GetQrJwksRequest) returns (GetQrJwksResponse);

  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc CancelSchedule(CancelScheduleRequest) returns (CancelScheduleResponse);
  // Runs schedules due on a date (sandbox/operations; a worker does it every 30 s).
  rpc RunDueSchedules(RunDueSchedulesRequest) returns (RunDueSchedulesResponse);

  // Pix Automático: the receiver requests, the payer approves, the receiver charges.
  rpc RequestMandate(RequestMandateRequest) returns (RequestMandateResponse);
  rpc DecideMandate(DecideMandateRequest) returns (DecideMandateResponse);
  rpc RevokeMandate(RevokeMandateRequest) returns (RevokeMandateResponse);
  rpc ListMandates(ListMandatesRequest) returns (ListMandatesResponse);
  rpc ChargeMandate(ChargeMandateRequest) returns (ChargeMandateResponse);
}

enum KeyType {
  KEY_TYPE_UNSPECIFIED = 0;
  KEY_TYPE_CPF = 1;
  KEY_TYPE_EMAIL = 2;
  KEY_TYPE_PHONE = 3;
  // Random key (UUID) generated by the bank.
  KEY_TYPE_EVP = 4;
}

message PixKey {
  string id = 1;
  string account_id = 2;
  KeyType type = 3;
  string value = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Receiver (or payer) as shown to the customer, with the document masked.
message Party {
  string name = 1;
  string document_masked = 2;
  // 8-digit bank identifier (ISPB).
  string ispb = 3;
  string bank_name = 4;
}

enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;
  TRANSFER_DIRECTION_OUTGOING = 1;
  TRANSFER_DIRECTION_INCOMING = 2;
}

enum TransferStatus {
  TRANSFER_STATUS_UNSPECIFIED = 0;
  TRANSFER_STATUS_CREATED = 1;
  TRANSFER_STATUS_FUNDS_RESERVED = 2;
  TRANSFER_STATUS_SENT_TO_SPI = 3;
  TRANSFER_STATUS_COMPLETED = 4;
  TRANSFER_STATUS_FAILED = 5;
  // Refused before any money moved (limits, funds, inactive account).
  TRANSFER_STATUS_REJECTED = 6;
}

message Transfer {
  string id = 1;
  // Unique Pix payment id: "E" + ISPB + yyyyMMddHHmm + 11 characters.
  string end_to_end_id = 2;
  TransferDirection direction = 3;
  TransferStatus status = 4;
  // Our customer's account (debited when outgoing, credited when incoming).
  string account_id = 5;
  string key = 6;
  Party counterparty = 7;
  bank.common.v1.Money amount = 8;
  string description = 9;
  string transaction_id = 10;
  string failure_reason = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // Set on a refund: the incoming transfer it returns money for.
  string refund_of = 14;
  // On an incoming transfer: amount already refunded (or being refunded).
  bank.common.v1.Money refunded = 15;
  // Set when the transfer paid a QR code charge.
  string qr_txid = 16;
}

message RegisterKeyRequest {
  string account_id = 1;
  KeyType type = 2;
  // Ignored for EVP keys, which are generated.
  string value = 3;
}

message RegisterKeyResponse {
  PixKey key = 1;
}

message DeleteKeyRequest {
  string account_id = 1;
  string key_id = 2;
}

message DeleteKeyResponse {}

message ListKeysRequest {
  string account_id = 1;
}

message ListKeysResponse {
  repeated PixKey keys = 1;
}

message LookupKeyRequest {
  string key = 1;
}

message LookupKeyResponse {
  KeyType type = 1;
  Party owner = 2;
}

message CreateTransferRequest {
  string idempotency_key = 1;
  string from_account_id = 2;
  // Receiver's Pix key.
  string key = 3;
  bank.common.v1.Money amount = 4;
  string description = 5;
}

message CreateTransferResponse {
  Transfer transfer = 1;
}

message GetTransferRequest {
  string id = 1;
}

message GetTransferResponse {
  Transfer transfer = 1;
}

message SimulateIncomingRequest {
  string end_to_end_id = 1;
  // Our customer's key receiving the money.
  string key = 2;
  bank.common.v1.Money amount = 3;
  Party payer = 4;
  string description = 5;
}

message SimulateIncomingResponse {
  Transfer transfer = 1;
}

message CreateQrCodeRequest {
  string account_id = 1;
  // One of the account's keys.
  string key = 2;
  // Optional: without it the payer chooses the amount.
  bank.common.v1.Money amount = 3;
  string description = 4;
  bool one_time = 5;
  // 0 = no expiry.
  int64 expires_in_seconds = 6;
  // Dynamic code: the BR Code carries a URL to a signed (JWS) payload.
  bool dynamic = 7;
}

message CreateQrCodeResponse {
  string txid = 1;
  // The "Pix copia e cola" string; render it as a QR code.
  string payload = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message DecodeQrCodeRequest {
  string payload = 1;
}

message DecodeQrCodeResponse {
  string key = 1;
  Party receiver = 2;
  // Absent when the payer chooses the amount.
  bank.common.v1.Money amount = 3;
  string txid = 4;
  string description = 5;
  bool one_time = 6;
  // True when the charge was issued by this bank.
  bool issued_here = 7;
}

message PayQrCodeRequest {
  string idempotency_key = 1;
  string from_account_id = 2;
  string payload = 3;
  // Required only when the code has no amount.
  bank.common.v1.Money amount = 4;
  string description = 5;
}

message PayQrCodeResponse {
  Transfer transfer = 1;
}

message RefundTransferRequest {
  string idempotency_key = 1;
  // The account that received the original transfer.
  string account_id = 2;
  string transfer_id = 3;
  bank.common.v1.Money amount = 4;
  string reason = 5;
}

message RefundTransferResponse {
  Transfer transfer = 1;
}

message ListTransfersRequest {
  string account_id = 1;
  // UNSPECIFIED lists both directions.
  TransferDirection direction = 2;
  // Defaults to 20, maximum 100.
  int32 page_size = 3;
  string page_token = 4;
}

message ListTransfersResponse {
  repeated Transfer transfers = 1;
  string next_page_token = 2;
}

message GetDynamicQrPayloadRequest {
  string txid = 1;
}

message GetDynamicQrPayloadResponse {
  // Compact JWS (EdDSA) of the charge.
  string jws = 1;
}

message GetQrJwksRequest {}

message Jwk {
  string kid = 1;
  string kty = 2;
  string crv = 3;
  string x = 4;
  string alg = 5;
}

message GetQrJwksResponse {
  repeated Jwk keys = 1;
}

enum Frequency {
  FREQUENCY_UNSPECIFIED = 0;
  FREQUENCY_ONCE = 1;
  FREQUENCY_WEEKLY = 2;
  FREQUENCY_MONTHLY = 3;
}

message Schedule {
  string id = 1;
  string account_id = 2;
  string key = 3;
  bank.common.v1.Money amount = 4;
  string description = 5;
  // YYYY-MM-DD (São Paulo calendar).
  string start_date = 6;
  Frequency frequency = 7;
  // 0 = until cancelled.
  int32 occurrences = 8;
  int32 executed = 9;
  string next_date = 10;
  // ACTIVE, CANCELLED, COMPLETED.
  string status = 11;
  string mandate_id = 12;
}

message CreateScheduleRequest {
  string idempotency_key = 1;
  string account_id = 2;
  string key = 3;
  bank.common.v1.Money amount = 4;
  string description = 5;
  string start_date = 6;
  Frequency frequency = 7;
  int32 occurrences = 8;
}

message CreateScheduleResponse {
  Schedule schedule = 1;
}

message ListSchedulesRequest {
  string account_id = 1;
}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
}

message CancelScheduleRequest {
  string account_id = 1;
  string schedule_id = 2;
}

message CancelScheduleResponse {
  Schedule schedule = 1;
}

message RunDueSchedulesRequest {
  // YYYY-MM-DD; empty = today.
  string as_of = 1;
}

message RunDueSchedulesResponse {
  int32 executed = 1;
}

message Mandate {
  string id = 1;
  string receiver_account_id = 2;
  string receiver_key = 3;
  string receiver_name = 4;
  string payer_account_id = 5;
  bank.common.v1.Money max_amount = 6;
  Frequency frequency = 7;
  string description = 8;
  // PENDING, ACTIVE, REJECTED, REVOKED.
  string status = 9;
}

message RequestMandateRequest {
  string receiver_account_id = 1;
  string receiver_key = 2;
  string payer_key = 3;
  bank.common.v1.Money max_amount = 4;
  Frequency frequency = 5;
  string description = 6;
}

message RequestMandateResponse {
  Mandate mandate = 1;
}

message DecideMandateRequest {
  string payer_account_id = 1;
  string mandate_id = 2;
  bool approve = 3;
}

message DecideMandateResponse {
  Mandate mandate = 1;
}

message RevokeMandateRequest {
  string account_id = 1;
  string mandate_id = 2;
}

message RevokeMandateResponse {
  Mandate mandate = 1;
}

message ListMandatesRequest {
  string account_id = 1;
}

message ListMandatesResponse {
  repeated Mandate mandates = 1;
}

message ChargeMandateRequest {
  string idempotency_key = 1;
  string receiver_account_id = 2;
  string mandate_id = 3;
  bank.common.v1.Money amount = 4;
  string due_date = 5;
}

message ChargeMandateResponse {
  Schedule schedule = 1;
}

message Contact {
  string key = 1;
  string name = 2;
  string bank_name = 3;
  string nickname = 4;
  bool favorite = 5;
  // Unset when nothing was sent to it yet.
  google.protobuf.Timestamp last_sent_at = 6;
  int32 times_sent = 7;
}

message ListContactsRequest {
  string account_id = 1;
}

message ListContactsResponse {
  repeated Contact contacts = 1;
}

message SaveFavoriteRequest {
  string account_id = 1;
  string key = 2;
  string nickname = 3;
}

message SaveFavoriteResponse {
  Contact contact = 1;
}

message RemoveFavoriteRequest {
  string account_id = 1;
  string key = 2;
}

message RemoveFavoriteResponse {}
