syntax = "proto3";

package bank.statement.v1;

import "bank/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// StatementService is the read side (CQRS): a per-account feed projected from
// transaction and account events. It is eventually consistent.
service StatementService {
  // Newest first, cursor-paginated.
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);
  // Where the money went in a month (Brasília time): card purchases by
  // category (from the merchant category code), Pix and transfers sent and
  // bills paid; refunds count against their category.
  rpc GetSpending(GetSpendingRequest) returns (GetSpendingResponse);
  // A receipt for one feed item, with an authentication code (the item id
  // and an HMAC of its fields under the bank's key).
  rpc GetReceipt(GetReceiptRequest) returns (GetReceiptResponse);
  // Checks an authentication code; NOT_FOUND when it is not genuine.
  rpc VerifyReceipt(VerifyReceiptRequest) returns (VerifyReceiptResponse);
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_DEBIT = 1;
  DIRECTION_CREDIT = 2;
}

message FeedItem {
  string id = 1;
  string account_id = 2;
  string transaction_id = 3;
  // INTERNAL_TRANSFER, PIX_OUT, PIX_IN.
  string type = 4;
  Direction direction = 5;
  bank.common.v1.Money amount = 6;
  string counterparty_name = 7;
  string description = 8;
  // Set for Pix.
  string end_to_end_id = 9;
  google.protobuf.Timestamp occurred_at = 10;
}

message ListFeedRequest {
  string account_id = 1;
  // Defaults to 20, maximum 100.
  int32 page_size = 2;
  string page_token = 3;
  // Optional period [from, to).
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
}

message ListFeedResponse {
  repeated FeedItem items = 1;
  string next_page_token = 2;
}

message GetSpendingRequest {
  string account_id = 1;
  // YYYY-MM; the current month when empty.
  string month = 2;
}

message CategorySpending {
  // FOOD, TRANSPORT, SHOPPING, SUBSCRIPTIONS, HEALTH, LEISURE, TRAVEL, HOME,
  // EDUCATION, BILLS, TRANSFERS, OTHER.
  string category = 1;
  bank.common.v1.Money amount = 2;
  int32 count = 3;
}

message MerchantSpending {
  string name = 1;
  string category = 2;
  bank.common.v1.Money amount = 3;
  int32 count = 4;
}

message GetSpendingResponse {
  string month = 1;
  bank.common.v1.Money total = 2;
  bank.common.v1.Money previous_total = 3;
  // Largest first.
  repeated CategorySpending categories = 4;
  // The five places with the most spent (Pix and transfers excluded).
  repeated MerchantSpending merchants = 5;
}

message Receipt {
  FeedItem item = 1;
  // The account the receipt belongs to.
  string holder_name = 2;
  string branch = 3;
  string number = 4;
  // The other account, when it is at this bank.
  string counterparty_branch = 5;
  string counterparty_number = 6;
  // Groups of letters and digits, e.g. "AB3D-...".
  string authentication_code = 7;
}

message GetReceiptRequest {
  string account_id = 1;
  string item_id = 2;
}

message GetReceiptResponse {
  Receipt receipt = 1;
}

message VerifyReceiptRequest {
  string authentication_code = 1;
}

message VerifyReceiptResponse {
  Receipt receipt = 1;
}
