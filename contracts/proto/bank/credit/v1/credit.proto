syntax = "proto3";

package bank.credit.v1;

import "bank/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// CreditService runs credit card lines: the limit, purchase holds made by
// card-service, monthly invoices, payments from the checking account and the
// charges on unpaid balances.
service CreditService {
  // Opens the credit line of an active account. Idempotent: one line per account.
  rpc OpenCreditLine(OpenCreditLineRequest) returns (OpenCreditLineResponse);
  rpc GetCreditLine(GetCreditLineRequest) returns (GetCreditLineResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  // Pays (part of) an open or closed invoice from the line's checking account.
  rpc PayInvoice(PayInvoiceRequest) returns (PayInvoiceResponse);

  // Card-facing: hold the limit for an authorization (idempotent on the key);
  // a refusal is a FAILED hold with a failure_reason, not an error.
  rpc ReserveCredit(ReserveCreditRequest) returns (ReserveCreditResponse);
  // Clearing: the purchase goes into the open invoice.
  rpc CaptureCredit(CaptureCreditRequest) returns (CaptureCreditResponse);
  rpc ReleaseCredit(ReleaseCreditRequest) returns (ReleaseCreditResponse);
  // Card refund on a captured credit purchase (merchant refund or won
  // dispute): a credit on the open invoice and the limit freed. Idempotent
  // on the key.
  rpc RefundCredit(RefundCreditRequest) returns (RefundCreditResponse);

  // The ways a closed invoice can be split (2 to 12 installments with
  // interest, Price table). FAILED_PRECONDITION: INVOICE_NOT_PLANNABLE,
  // PAYMENT_IN_PROGRESS, INVOICE_TOO_SMALL.
  rpc QuoteInvoicePlan(QuoteInvoicePlanRequest) returns (QuoteInvoicePlanResponse);
  // Splits a closed invoice: it is settled by the plan and one installment
  // goes on each invoice from the open one. Idempotent on the key.
  rpc PlanInvoice(PlanInvoiceRequest) returns (PlanInvoiceResponse);

  // Asks for a new limit (idempotent on the key): decreases (never below
  // what is used) apply at once; increases up to what the score allows
  // (+50%, +100% from 750) apply at once, an overdue invoice or a score
  // under 250 refuses them, larger ones go to an analyst (IN_REVIEW).
  rpc RequestLimit(RequestLimitRequest) returns (RequestLimitResponse);
  // By account, or every account (back office) by status.
  rpc ListLimitRequests(ListLimitRequestsRequest) returns (ListLimitRequestsResponse);
  // An analyst's decision on a request in review (may grant less); above
  // R$ 10.000,00 only with a second approver (four-eyes).
  rpc DecideLimitRequest(DecideLimitRequestRequest) returns (DecideLimitRequestResponse);

  // The bank's behaviour score (0..1000) for the account's card, with the
  // factors behind it.
  rpc GetCreditScore(GetCreditScoreRequest) returns (GetCreditScoreResponse);

  // Installment purchases and invoice plans with installments still to come.
  rpc ListInstallmentPlans(ListInstallmentPlansRequest) returns (ListInstallmentPlansResponse);

  // Sandbox: close the open invoice now, or make the closed one overdue.
  rpc AdvanceCycle(AdvanceCycleRequest) returns (AdvanceCycleResponse);
}

message CreditLine {
  string id = 1;
  string account_id = 2;
  // ACTIVE, BLOCKED.
  string status = 3;
  bank.common.v1.Money limit = 4;
  bank.common.v1.Money used = 5;
  bank.common.v1.Money available = 6;
  int32 closing_day = 7;
  // Monthly interest on unpaid balances, in basis points (800 = 8% a month).
  int32 interest_rate_bp = 8;
  google.protobuf.Timestamp created_at = 9;
  // Installments of past purchases not on an invoice yet (part of used).
  bank.common.v1.Money upcoming_installments = 10;
}

message Invoice {
  string id = 1;
  string line_id = 2;
  // OPEN (receiving purchases), CLOSED (to be paid), PAID, OVERDUE (the
  // unpaid balance moved to the next invoice with a fine and interest).
  string status = 3;
  // YYYY-MM-DD, São Paulo.
  string closing_date = 4;
  string due_date = 5;
  bank.common.v1.Money total = 6;
  bank.common.v1.Money paid = 7;
  bank.common.v1.Money remaining = 8;
  // The minimum payment: 15% of the balance, at least R$ 50 (or all of it).
  // Whatever is not paid by the due date rolls over with charges.
  bank.common.v1.Money minimum_payment = 9;
}

message InvoiceItem {
  string id = 1;
  // PURCHASE, PAYMENT, BALANCE_CARRIED, FINE, INTEREST (owed), REFUND and
  // CREDIT_CARRIED_IN (credits), CREDIT_CARRIED_OUT (a credit moved to the
  // next invoice).
  string kind = 2;
  bank.common.v1.Money amount = 3;
  string description = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message Hold {
  string id = 1;
  // RESERVED, CAPTURED, RELEASED, FAILED.
  string status = 2;
  // INSUFFICIENT_LIMIT, NO_CREDIT_LINE, CREDIT_LINE_BLOCKED.
  string failure_reason = 3;
  bank.common.v1.Money amount = 4;
  bank.common.v1.Money captured = 5;
  int32 installments = 6;
}

message Payment {
  string id = 1;
  string invoice_id = 2;
  // PENDING, COMPLETED, FAILED.
  string status = 3;
  string failure_reason = 4;
  bank.common.v1.Money amount = 5;
  google.protobuf.Timestamp created_at = 6;
}

message OpenCreditLineRequest {
  string idempotency_key = 1;
  string account_id = 2;
  // 1-28; the invoice is due 10 days after closing.
  int32 closing_day = 3;
}

message OpenCreditLineResponse {
  CreditLine line = 1;
}

message GetCreditLineRequest {
  string account_id = 1;
}

message GetCreditLineResponse {
  CreditLine line = 1;
}

message ListInvoicesRequest {
  string account_id = 1;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}

message GetInvoiceRequest {
  string id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
  string account_id = 2;
  repeated InvoiceItem items = 3;
}

message PayInvoiceRequest {
  string idempotency_key = 1;
  string invoice_id = 2;
  bank.common.v1.Money amount = 3;
}

message PayInvoiceResponse {
  Payment payment = 1;
}

message ReserveCreditRequest {
  string idempotency_key = 1;
  string account_id = 2;
  bank.common.v1.Money amount = 3;
  string description = 4;
  map<string, string> metadata = 5;
  // 1 (default) to 12: interest-free installments ("parcelado sem juros").
  // The whole amount is held on the limit; one installment goes on each
  // invoice from the one the purchase is captured on.
  int32 installments = 6;
}

message ReserveCreditResponse {
  Hold hold = 1;
}

message CaptureCreditRequest {
  string hold_id = 1;
  // Optional: capture less than was held.
  bank.common.v1.Money amount = 2;
}

message CaptureCreditResponse {
  Hold hold = 1;
}

message ReleaseCreditRequest {
  string hold_id = 1;
  string reason = 2;
}

message ReleaseCreditResponse {
  Hold hold = 1;
}

message AdvanceCycleRequest {
  string account_id = 1;
  // CLOSE or EXPIRE.
  string action = 2;
}

message AdvanceCycleResponse {}

message RefundCreditRequest {
  string idempotency_key = 1;
  string account_id = 2;
  bank.common.v1.Money amount = 3;
  string description = 4;
  map<string, string> metadata = 5;
}

message CreditRefund {
  string id = 1;
  string account_id = 2;
  string invoice_id = 3;
  bank.common.v1.Money amount = 4;
  // COMPLETED.
  string status = 5;
}

message RefundCreditResponse {
  CreditRefund refund = 1;
}

message InstallmentPlan {
  string hold_id = 1;
  string description = 2;
  bank.common.v1.Money total = 3;
  int32 installments = 4;
  // Installments already on an invoice.
  int32 billed = 5;
  bank.common.v1.Money installment_amount = 6;
  bank.common.v1.Money remaining = 7;
  google.protobuf.Timestamp purchased_at = 8;
}

message ListInstallmentPlansRequest {
  string account_id = 1;
}

message ListInstallmentPlansResponse {
  repeated InstallmentPlan plans = 1;
}

message PlanQuote {
  int32 installments = 1;
  bank.common.v1.Money installment = 2;
  bank.common.v1.Money total = 3;
  bank.common.v1.Money interest = 4;
  int32 monthly_rate_bp = 5;
  // CET: the total yearly cost, in basis points.
  int32 annual_cost_bp = 6;
}

message QuoteInvoicePlanRequest {
  string invoice_id = 1;
}

message QuoteInvoicePlanResponse {
  repeated PlanQuote quotes = 1;
}

message PlanInvoiceRequest {
  string idempotency_key = 1;
  string invoice_id = 2;
  int32 installments = 3;
}

message InvoicePlan {
  string id = 1;
  string invoice_id = 2;
  bank.common.v1.Money principal = 3;
  int32 installments = 4;
  bank.common.v1.Money installment = 5;
  bank.common.v1.Money interest = 6;
  int32 monthly_rate_bp = 7;
}

message PlanInvoiceResponse {
  InvoicePlan plan = 1;
}

message LimitRequest {
  string id = 1;
  string account_id = 2;
  bank.common.v1.Money current_limit = 3;
  bank.common.v1.Money requested = 4;
  // APPROVED, REJECTED, IN_REVIEW.
  string status = 5;
  bank.common.v1.Money granted = 6;
  // Why it was rejected (HAS_OVERDUE_INVOICE, CREDIT_LINE_BLOCKED, LOW_SCORE or the
  // analyst's words), or the analyst's note.
  string reason = 7;
  // "automatic" or the analyst.
  string decided_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp decided_at = 10;
  // The customer's score when the request was analyzed.
  int32 score = 11;
  // The analyst who confirmed a grant above R$ 10.000,00.
  string second_approver = 12;
}

message RequestLimitRequest {
  string idempotency_key = 1;
  string account_id = 2;
  bank.common.v1.Money amount = 3;
}

message RequestLimitResponse {
  LimitRequest request = 1;
}

message ListLimitRequestsRequest {
  string account_id = 1;
  string status = 2;
}

message ListLimitRequestsResponse {
  repeated LimitRequest requests = 1;
}

message DecideLimitRequestRequest {
  string id = 1;
  string analyst_id = 2;
  bool approve = 3;
  // Optional: grant less than requested.
  bank.common.v1.Money granted = 4;
  string reason = 5;
  // Required to grant more than R$ 10.000,00 (four-eyes): another analyst
  // who confirmed it; otherwise FAILED_PRECONDITION FOUR_EYES_REQUIRED.
  string second_approver_id = 6;
}

message DecideLimitRequestResponse {
  LimitRequest request = 1;
}

message GetCreditScoreRequest {
  string account_id = 1;
}

message ScoreFactor {
  // PAYMENT_HISTORY, LATE_PAYMENTS, OVERDUE_NOW, UTILIZATION, RELATIONSHIP,
  // INVOICE_PLANS.
  string code = 1;
  // Points added (negative: taken) to the base of 500.
  int32 points = 2;
  // What is behind them: a count of invoices or plans, the share of the
  // limit used (%), or the months of relationship.
  int32 value = 3;
}

message GetCreditScoreResponse {
  // 0..1000.
  int32 score = 1;
  // LOW, FAIR, GOOD, EXCELLENT.
  string band = 2;
  repeated ScoreFactor factors = 3;
  // How much more the automatic analysis grants at once, in basis points of
  // the limit (0: an analyst decides any increase).
  int32 auto_increase_bp = 4;
}
