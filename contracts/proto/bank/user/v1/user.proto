syntax = "proto3";

package bank.user.v1;

// UserService runs onboarding: the customer profile and KYC verification.
// Accounts can only be opened for customers it has verified.
service UserService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // Creates or updates the profile; name, CPF and birth date lock once
  // verification starts.
  rpc UpsertProfile(UpsertProfileRequest) returns (UpsertProfileResponse);
  // Starts KYC (idempotent): APPROVED, REJECTED, MANUAL_REVIEW, or PENDING
  // while the bureau has not answered.
  rpc SubmitKyc(SubmitKycRequest) returns (SubmitKycResponse);
  // An analyst's decision on a verification in MANUAL_REVIEW.
  rpc ReviewKyc(ReviewKycRequest) returns (ReviewKycResponse);
  // The verified identity, for account-service (includes the full CPF).
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
}

message Address {
  // CEP, 8 digits.
  string postal_code = 1;
  string street = 2;
  string number = 3;
  string complement = 4;
  string district = 5;
  string city = 6;
  // UF, e.g. SP.
  string state = 7;
}

message Profile {
  string customer_id = 1;
  string full_name = 2;
  string cpf_masked = 3;
  // YYYY-MM-DD.
  string birth_date = 4;
  string phone = 5;
  Address address = 6;
  // NOT_STARTED, PENDING, APPROVED, REJECTED, MANUAL_REVIEW.
  string kyc_status = 7;
  string kyc_reason = 8;
}

message GetProfileRequest {
  string customer_id = 1;
}

message GetProfileResponse {
  Profile profile = 1;
}

message UpsertProfileRequest {
  string customer_id = 1;
  string full_name = 2;
  string cpf = 3;
  string birth_date = 4;
  string phone = 5;
  Address address = 6;
}

message UpsertProfileResponse {
  Profile profile = 1;
}

message SubmitKycRequest {
  string customer_id = 1;
}

message SubmitKycResponse {
  Profile profile = 1;
}

message ReviewKycRequest {
  string customer_id = 1;
  bool approve = 2;
  string reason = 3;
}

message ReviewKycResponse {
  Profile profile = 1;
}

message GetIdentityRequest {
  string customer_id = 1;
}

message GetIdentityResponse {
  string kyc_status = 1;
  string full_name = 2;
  string cpf = 3;
}
