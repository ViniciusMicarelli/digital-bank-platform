syntax = "proto3";

package bank.card.v1;

import "bank/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// CardService issues debit cards and authorizes purchases in real time. The
// card network is simulated: Authorize / Clear / Reverse are what a network
// (or the sandbox) calls.
service CardService {
  // Issues a card for an active account. Idempotent on idempotency_key.
  rpc IssueCard(IssueCardRequest) returns (IssueCardResponse);
  rpc GetCard(GetCardRequest) returns (GetCardResponse);
  rpc ListCards(ListCardsRequest) returns (ListCardsResponse);
  rpc BlockCard(BlockCardRequest) returns (BlockCardResponse);
  rpc UnblockCard(UnblockCardRequest) returns (UnblockCardResponse);
  rpc UpdateControls(UpdateControlsRequest) returns (UpdateControlsResponse);
  // Returns the full card number, expiry and CVV to the card holder.
  rpc RevealCardDetails(RevealCardDetailsRequest) returns (RevealCardDetailsResponse);

  // Provisions a token (a different card number) for a wallet or a merchant.
  rpc TokenizeCard(TokenizeCardRequest) returns (TokenizeCardResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  // SUSPEND, RESUME or DELETE one token without touching the card.
  rpc UpdateToken(UpdateTokenRequest) returns (UpdateTokenResponse);

  // Real-time authorization. Idempotent on network_reference. Declines are
  // normal responses (status DECLINED with an ISO 8583-style response code).
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  // Settles an approved authorization, for its amount or less.
  rpc Clear(ClearRequest) returns (ClearResponse);
  // Cancels an approved authorization (merchant void); the money is released.
  rpc Reverse(ReverseRequest) returns (ReverseResponse);
  // Network: the merchant refunds (part of) a cleared purchase; idempotent
  // on refund_reference. Fails with FAILED_PRECONDITION and reason
  // REFUND_TOO_LARGE or NOT_CLEARED.
  rpc Refund(RefundRequest) returns (RefundResponse);

  // A card's purchases, newest first, with what was refunded and any dispute.
  rpc ListAuthorizations(ListAuthorizationsRequest) returns (ListAuthorizationsResponse);

  // The customer disputes a cleared purchase (chargeback). A purchase the
  // customer does not recognize blocks the card at once. Fails with
  // FAILED_PRECONDITION and reason NOT_CLEARED, DISPUTE_WINDOW_CLOSED,
  // DISPUTE_ALREADY_OPEN or NOTHING_TO_DISPUTE.
  rpc OpenDispute(OpenDisputeRequest) returns (OpenDisputeResponse);
  rpc GetDispute(GetDisputeRequest) returns (GetDisputeResponse);
  // By account (the customer) or by status (the back office).
  rpc ListDisputes(ListDisputesRequest) returns (ListDisputesResponse);
  // An analyst's decision: won refunds the disputed amount; lost needs a
  // reason. Fails with FAILED_PRECONDITION and reason DISPUTE_NOT_OPEN.
  rpc DecideDispute(DecideDisputeRequest) returns (DecideDisputeResponse);
}

enum CardKind {
  CARD_KIND_UNSPECIFIED = 0;
  CARD_KIND_PHYSICAL = 1;
  CARD_KIND_VIRTUAL = 2;
}

enum CardStatus {
  CARD_STATUS_UNSPECIFIED = 0;
  CARD_STATUS_ACTIVE = 1;
  CARD_STATUS_BLOCKED = 2;
  CARD_STATUS_CANCELLED = 3;
}

message Controls {
  bool online = 1;
  bool international = 2;
  bool contactless = 3;
}

message Card {
  string id = 1;
  string account_id = 2;
  CardKind kind = 3;
  CardStatus status = 4;
  string status_reason = 5;
  string last4 = 6;
  int32 expiry_month = 7;
  int32 expiry_year = 8;
  string holder_name = 9;
  Controls controls = 10;
  google.protobuf.Timestamp created_at = 11;
}

message IssueCardRequest {
  string idempotency_key = 1;
  string account_id = 2;
  CardKind kind = 3;
}

message IssueCardResponse {
  Card card = 1;
}

message GetCardRequest {
  string id = 1;
}

message GetCardResponse {
  Card card = 1;
}

message ListCardsRequest {
  string account_id = 1;
}

message ListCardsResponse {
  repeated Card cards = 1;
}

message BlockCardRequest {
  string id = 1;
  string reason = 2;
}

message BlockCardResponse {
  Card card = 1;
}

message UnblockCardRequest {
  string id = 1;
}

message UnblockCardResponse {
  Card card = 1;
}

message UpdateControlsRequest {
  string id = 1;
  Controls controls = 2;
}

message UpdateControlsResponse {
  Card card = 1;
}

message RevealCardDetailsRequest {
  string id = 1;
}

message RevealCardDetailsResponse {
  string pan = 1;
  int32 expiry_month = 2;
  int32 expiry_year = 3;
  string cvv = 4;
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  // Card not present: CVV required.
  CHANNEL_ONLINE = 1;
  CHANNEL_CHIP = 2;
  CHANNEL_CONTACTLESS = 3;
}

// Which account the network charges: the checking account (debit) or the
// credit line (credit, through credit-service).
enum Function {
  FUNCTION_UNSPECIFIED = 0;
  FUNCTION_DEBIT = 1;
  FUNCTION_CREDIT = 2;
}

enum AuthorizationStatus {
  AUTHORIZATION_STATUS_UNSPECIFIED = 0;
  AUTHORIZATION_STATUS_APPROVED = 1;
  AUTHORIZATION_STATUS_DECLINED = 2;
  AUTHORIZATION_STATUS_CLEARED = 3;
  AUTHORIZATION_STATUS_REVERSED = 4;
}

message Authorization {
  string id = 1;
  string network_reference = 2;
  string card_id = 3;
  AuthorizationStatus status = 4;
  // "00" approved; otherwise ISO 8583-style: 05, 14, 51, 54, 57, 61, 62, 82, 91.
  string response_code = 5;
  string reason = 6;
  bank.common.v1.Money amount = 7;
  bank.common.v1.Money cleared_amount = 8;
  string merchant_name = 9;
  string mcc = 10;
  string country = 11;
  Channel channel = 12;
  google.protobuf.Timestamp created_at = 13;
  // Set when the purchase was made with a token.
  string token_id = 14;
  Function function = 15;
  // Refunded so far (merchant refunds and won disputes).
  bank.common.v1.Money refunded_amount = 16;
  // The latest dispute of this purchase, if any.
  Dispute dispute = 17;
  // 1 unless paid in installments on credit.
  int32 installments = 18;
}

message AuthorizeRequest {
  // Unique id from the network; retries reuse it.
  string network_reference = 1;
  string pan = 2;
  int32 expiry_month = 3;
  int32 expiry_year = 4;
  string cvv = 5;
  bank.common.v1.Money amount = 6;
  string merchant_name = 7;
  // Merchant category code (ISO 18245).
  string mcc = 8;
  // ISO 3166 alpha-2.
  string country = 9;
  Channel channel = 10;
  // Debit by default.
  Function function = 11;
  // Credit only: 2 to 12 interest-free installments (each at least R$ 5,00).
  int32 installments = 12;
}

message AuthorizeResponse {
  Authorization authorization = 1;
}

message ClearRequest {
  string authorization_id = 1;
  // Optional: clear less than was authorized.
  bank.common.v1.Money amount = 2;
}

message ClearResponse {
  Authorization authorization = 1;
}

message ReverseRequest {
  string authorization_id = 1;
}

message ReverseResponse {
  Authorization authorization = 1;
}

message CardToken {
  string id = 1;
  string card_id = 2;
  // APPLE_PAY, GOOGLE_PAY, SAMSUNG_PAY, MERCHANT.
  string wallet = 3;
  string device_name = 4;
  // ACTIVE, SUSPENDED, DELETED.
  string status = 5;
  string last4 = 6;
  google.protobuf.Timestamp created_at = 7;
}

message TokenizeCardRequest {
  string card_id = 1;
  string wallet = 2;
  string device_name = 3;
}

message TokenizeCardResponse {
  CardToken token = 1;
  // Delivered once to the wallet; never shown again.
  string token_pan = 2;
}

message ListTokensRequest {
  string card_id = 1;
}

message ListTokensResponse {
  repeated CardToken tokens = 1;
}

message UpdateTokenRequest {
  string card_id = 1;
  string token_id = 2;
  string action = 3;
}

message UpdateTokenResponse {
  CardToken token = 1;
}

message RefundRequest {
  string authorization_id = 1;
  // The network's id of this refund; retries reuse it.
  string refund_reference = 2;
  bank.common.v1.Money amount = 3;
}

message Refund {
  string id = 1;
  string authorization_id = 2;
  bank.common.v1.Money amount = 3;
  // MERCHANT or DISPUTE.
  string source = 4;
  // PENDING (money on its way, retried), COMPLETED, FAILED.
  string status = 5;
  string failure_reason = 6;
  google.protobuf.Timestamp created_at = 7;
}

message RefundResponse {
  Refund refund = 1;
}

message ListAuthorizationsRequest {
  string card_id = 1;
  int32 limit = 2;
}

message ListAuthorizationsResponse {
  repeated Authorization authorizations = 1;
}

enum DisputeReason {
  DISPUTE_REASON_UNSPECIFIED = 0;
  // Fraud: the customer did not make this purchase (blocks the card).
  DISPUTE_REASON_NOT_RECOGNIZED = 1;
  DISPUTE_REASON_NOT_RECEIVED = 2;
  DISPUTE_REASON_DUPLICATE = 3;
  DISPUTE_REASON_WRONG_AMOUNT = 4;
  // Subscription or order cancelled and still charged.
  DISPUTE_REASON_CANCELLED = 5;
}

enum DisputeStatus {
  DISPUTE_STATUS_UNSPECIFIED = 0;
  DISPUTE_STATUS_OPEN = 1;
  // Decided for the customer: the amount was refunded.
  DISPUTE_STATUS_WON = 2;
  DISPUTE_STATUS_LOST = 3;
}

message Dispute {
  string id = 1;
  string authorization_id = 2;
  string card_id = 3;
  string account_id = 4;
  DisputeReason reason = 5;
  bank.common.v1.Money amount = 6;
  string description = 7;
  DisputeStatus status = 8;
  string decided_by = 9;
  string decision_reason = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp decided_at = 12;
  string merchant_name = 13;
  google.protobuf.Timestamp purchased_at = 14;
}

message OpenDisputeRequest {
  string authorization_id = 1;
  DisputeReason reason = 2;
  // Optional: defaults to everything not refunded yet.
  bank.common.v1.Money amount = 3;
  string description = 4;
  // The card the purchase must belong to (NOT_FOUND otherwise).
  string card_id = 5;
}

message OpenDisputeResponse {
  Dispute dispute = 1;
}

message GetDisputeRequest {
  string id = 1;
}

message GetDisputeResponse {
  Dispute dispute = 1;
}

message ListDisputesRequest {
  string account_id = 1;
  DisputeStatus status = 2;
  int32 limit = 3;
}

message ListDisputesResponse {
  repeated Dispute disputes = 1;
}

message DecideDisputeRequest {
  string id = 1;
  string analyst_id = 2;
  bool won = 3;
  string reason = 4;
}

message DecideDisputeResponse {
  Dispute dispute = 1;
}
