name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U bank"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: make tools
      - run: make lint
      - name: Generated code is up to date
        run: make generate && git diff --exit-code contracts/gen
      - run: make test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: make up
      - run: make e2e
      - run: sudo apt-get install -y jq && make demo
      - if: failure()
        run: docker compose logs

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - run: make k8s-validate
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0
      - run: make tf-validate

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ledger-service, account-service, transaction-service, pix-service, statement-service, identity-service, card-service, credit-service, kms-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t ${{ matrix.service }} .
