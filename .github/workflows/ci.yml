name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U bank"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: make tools
      - run: make lint
      - name: Generated code is up to date
        run: make generate && git diff --exit-code contracts/gen
      - run: make test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: make up
      - run: make e2e
      - run: sudo apt-get install -y jq && make demo
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Browser tests against the web image
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://127.0.0.1:8081 npx playwright test
          COLOR_SCHEME=dark BASE_URL=http://127.0.0.1:8081 npx playwright test
      - name: Mobile app (web build) against the stack
        working-directory: apps/mobile
        run: |
          npm ci
          EXPO_PUBLIC_API_URL=http://localhost:8000 npx expo export --platform web
          npx playwright test
      - if: failure()
        run: docker compose logs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx expo lint
      - run: npm run typecheck
      - run: npx expo-doctor
      - run: npx expo export --platform web

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - run: make k8s-validate
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0
      - run: make tf-validate

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ledger-service, account-service, transaction-service, pix-service, statement-service, identity-service, card-service, credit-service, payment-service, notification-service, user-service, backoffice-service, kms-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t ${{ matrix.service }} .
